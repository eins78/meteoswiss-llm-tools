# Hourly weather symbol + cloud cover (PR #183) — see src/symbol-cloud.ts for the design and
# docs/results/2026-11-11-hourly-symbol-cloud.md for the results.
#
# Same prompt and the same six models (same generation settings) as the 2026-07-11 Round-2 run
# (docs/results/2026-07-11-hourly-multiseries-shape-refinement.md), so the numbers compare.
# Tests: generated/symbol-tests.json (`pnpm run generate`), 4 arms x 19 questions.
#
# Run: `pnpm run symbol:dryrun`, `pnpm run symbol:smoke` (cheap/gemini-3.1-flash-lite only; its
# rows are then served from promptfoo's cache in the full run), `pnpm run symbol:eval`.
# API key: OPENROUTER_API_KEY in the environment — see README.md.

description: 'meteoswissLocalForecast JSON comprehension — hourly symbol + cloud cover (PR #183)'

prompts:
  - |
    You are given a JSON weather forecast object, as returned by a Swiss weather tool
    (MeteoSwiss "getLocalForecast"). Read it carefully, then answer the question using ONLY
    the JSON provided — do not use outside weather knowledge, and do not guess.

    FORECAST JSON:
    {{json_blob}}

    QUESTION:
    {{question}}

providers:
  - id: openrouter:anthropic/claude-opus-4.8
    label: frontier/opus-4.8
    config: &lookup_config
      temperature: 0
      max_tokens: 256
      passthrough:
        reasoning:
          enabled: false
  # max_tokens 1024: see promptfooconfig.yaml (this model leaks reasoning text into the answer).
  - id: openrouter:google/gemini-3.1-pro-preview
    label: frontier/gemini-3.1-pro
    config:
      temperature: 0
      max_tokens: 1024
      passthrough:
        reasoning:
          effort: minimal
  - id: openrouter:anthropic/claude-haiku-4.5
    label: cheap/haiku-4.5
    config: *lookup_config
  - id: openrouter:google/gemini-3.1-flash-lite
    label: cheap/gemini-3.1-flash-lite
    config: *lookup_config
  - id: openrouter:openai/gpt-5-nano
    label: tiny/gpt-5-nano
    config:
      temperature: 0
      max_tokens: 256
      passthrough:
        reasoning:
          effort: minimal
  - id: openrouter:mistralai/ministral-8b-2512
    label: tiny/ministral-8b
    config: *lookup_config
  - id: echo
    label: debug/echo

tests: file://generated/symbol-tests.json

outputPath: generated/results-symbol.json
