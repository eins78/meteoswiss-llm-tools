name: Release MCP Server

on:
  release:
    types: [published]

concurrency:
  group: release-mcp
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/eins78/meteoswiss-mcp
  NODE_VERSION: 24
  PACKAGE_DIR: packages/meteoswiss-mcp

jobs:
  ci:
    name: CI Validation
    if: startsWith(github.event.release.tag_name, 'meteoswiss-mcp-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter meteoswiss-mcp run lint

      - name: Build
        run: pnpm --filter meteoswiss-mcp run build

      - name: Test
        run: pnpm --filter meteoswiss-mcp test
        env:
          USE_TEST_FIXTURES: 'true'
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Integration tests
        run: pnpm --filter meteoswiss-mcp run test:integration
        env:
          USE_TEST_FIXTURES: 'true'
          NODE_OPTIONS: '--experimental-vm-modules'

  publish-npm:
    name: Publish to npm
    if: startsWith(github.event.release.tag_name, 'meteoswiss-mcp-v')
    runs-on: ubuntu-latest
    needs: ci
    environment: npm

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#meteoswiss-mcp-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter meteoswiss-mcp run build

      - name: Set package version
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ steps.version.outputs.version }}" ]; then
            npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          else
            echo "Version already set to $CURRENT"
          fi

      - name: Publish to npm
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Comment pre-release on Version Packages PR
        # Keeps RC publishes visible from the standing Version Packages PR;
        # no-ops cleanly if there's no open PR at the time.
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/comment-prerelease-pr.sh meteoswiss-mcp "$PACKAGE_VERSION"

  publish-docker:
    name: Publish to GHCR
    if: startsWith(github.event.release.tag_name, 'meteoswiss-mcp-v')
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#meteoswiss-mcp-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package version from tag
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ steps.version.outputs.version }}" ]; then
            npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          else
            echo "Version already set to $CURRENT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker-tags
        run: |
          TAGS="${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "false" ]]; then
            TAGS="${TAGS},${{ env.DOCKER_IMAGE }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ env.PACKAGE_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
