name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build-test:
    name: Lint, Build & Test  
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run lint (TypeScript + ESLint)
        run: pnpm --filter meteoswiss-mcp run lint

      - name: Run build (TypeScript compilation)
        run: pnpm --filter meteoswiss-mcp run build

      - name: Run tests
        run: pnpm --filter meteoswiss-mcp test
        env:
          USE_TEST_FIXTURES: true
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Run integration tests
        run: pnpm --filter meteoswiss-mcp run test:integration
        env:
          USE_TEST_FIXTURES: true
          NODE_OPTIONS: '--experimental-vm-modules'

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/meteoswiss-mcp/Dockerfile
          push: false
          load: true
          tags: meteoswiss-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Test Docker container
        run: |
          # Start container in background
          docker run -d --name test-container -p 3000:3000 meteoswiss-mcp:test
          
          # Wait for container to start
          sleep 15
          
          # Test health endpoint
          timeout 30s bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'
          
          # Clean up
          docker stop test-container
          docker rm test-container

  skill-validation:
    name: Skill Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate skills
        run: pnpm --filter meteoswiss-skills test

      - name: Skills-MCP parity (structural gate)
        run: pnpm --filter meteoswiss-mcp run lint:parity

  forecast-evals:
    name: Forecast Evals — Scoring Unit Tests (offline, no API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # `pnpm test` here = the OFFLINE scoring unit tests (ground truth + scorer):
      # `node --test src/*.test.ts`. No OpenRouter/LLM calls, no API keys, no cost.
      # The paid LLM evals (`pnpm eval` / `smoke` / `eval:judge`) are local-dev-only
      # and MUST NEVER run in CI — see packages/meteoswiss-forecast-evals/README.md
      # "CI policy". Deliberately not a workspace member (see pnpm-workspace.yaml), so
      # we install and run in its own directory.
      - name: Install forecast-evals dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/meteoswiss-forecast-evals

      - name: Run forecast-evals scoring unit tests (offline)
        run: pnpm test
        working-directory: packages/meteoswiss-forecast-evals

  security-audit:
    name: Security & Dependency Check
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run security audit
        run: pnpm audit --audit-level moderate
        
      - name: Check for outdated packages
        run: |
          outdated_output=$(pnpm outdated --no-color --no-table 2>/dev/null || true)
          if [ -n "$outdated_output" ]; then
            # Convert newlines to %0A for GitHub Actions notice format
            formatted_output=$(echo "$outdated_output" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice file=package.json,line=1::Outdated packages found:%0A$formatted_output"
          else
            echo "All packages are up to date"
          fi
