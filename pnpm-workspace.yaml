packages:
  - "packages/*"
  # Deliberately NOT a workspace member — see packages/meteoswiss-forecast-evals/docs/spec.md "Q-B"
  # for why: it needs promptfoo as a real, lockfile-pinned dependency, but pnpm has no
  # mechanism to keep a package IN the workspace while excluding its deps from the default
  # root `pnpm install`. Isolating it as a standalone npm project (own pnpm-lock.yaml, `cd`
  # + `pnpm install` before use) is the only way to get both. Run it standalone:
  #   cd packages/meteoswiss-forecast-evals && pnpm install && pnpm run eval
  - "!packages/meteoswiss-forecast-evals"
  # Same reasoning, different large dependency tree (Astro + Starlight). Standalone project:
  #   cd packages/meteoswiss-docs-site && pnpm install && pnpm run build
  - "!packages/meteoswiss-docs-site"
# pnpm >= 12: allowBuilds replaces onlyBuiltDependencies (build scripts are hard-denied otherwise)
allowBuilds:
  esbuild: true
  unrs-resolver: true
# pnpm >= 12: overrides and auditConfig moved here from package.json's `pnpm` field (no longer read)
overrides:
  minimatch@<3.1.4: 10.2.6
  flatted@<3.4.2: 3.4.4
  picomatch@<2.3.2: 4.0.7
  path-to-regexp@<0.1.13: 8.4.2
  path-to-regexp@>=8.0.0 <8.4.0: 8.4.2
  qs@<6.16.0: 6.16.0
  diff@>=4.0.0 <4.0.4: 9.0.0
  js-yaml@<4.3.2: 4.3.2
  read-yaml-file: ^2.1.0
  mcp-remote>path-to-regexp: 8.4.2
  eslint-plugin-tsdoc>@typescript-eslint/utils: 8.71.1
  shell-quote@<1.12.0: 1.12.0
  fast-uri@<4.2.1: 4.2.1
  form-data@>=4.0.0 <4.0.6: 4.0.6
  ip-address@<=10.3.0: 10.7.3
  undici@<8.11.2: 8.11.2
  ws@>=8.0.0 <8.22.0: 8.22.0
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  proxy-addr@<2.0.8: 2.0.8
  handlebars@<4.7.10: 4.7.10
  hono: ">=4.12.34"
  browserslist@<=4.28.6: 4.28.7
  "@humanfs/node@<0.16.8": 0.16.8
  "@hono/node-server": ">=1.19.13"
auditConfig:
  ignoreGhsas:
    - GHSA-frvp-7c67-39w9
    - GHSA-vfj7-8cjw-p6xm
